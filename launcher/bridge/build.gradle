plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvbridge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvbridge'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
